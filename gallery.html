<!doctype html>
<html lang="en">

<head>
  <title>Sree Arunachala Infra Group — Home</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="assets/img/saig-without-textlogo.svg">
  <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main content -->

  <main class="container mt-5 flex-fill">

    <div class="row">
      <div class="col-12">

        <!-- Heading -->
        <h2 class="custom-font-large custom-font-bold mb-4  mt-5 text-center"
          style="color: var(--saig-main-dark-color); letter-spacing: 1px;">
          — GALLERY —
        </h2>

        <section class="py-5">

          <div class="container">

            <div id="galleryLoading" class="text-center py-5">

              <div class="spinner-border" style="color:var(--saig-logo-brown-dark);"></div>

              <p class="mt-3 custom-font-paras">
                Loading gallery...
              </p>

            </div>

            <div id="galleryContent" style="display:none;">
            </div>

          </div>

        </section>


      </div>
  </main>

  <!-- Fullscreen Image Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-body d-flex justify-content-center align-items-center p-0">
          <img id="modalImage" src="" alt="Full screen image" class="img-fluid full-screen-img">
        </div>
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
          data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Footer-->
  <div id="footer" class="mt-auto py-1"></div>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/gallery.js"></script>
</body>

</html>
