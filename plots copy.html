<!DOCTYPE html>
<html>
<head>
  <title>Plot Availability</title>
  <style>
    svg { width: 100%; height: auto; }
    .plot { stroke: #333; stroke-width: 1; cursor: pointer; }
    #popup {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>

<body>

<h2>Solaris Meadows - Plot Availability</h2>

<p>
🟢 Available &nbsp;&nbsp;
🟡 Reserved &nbsp;&nbsp;
🔴 Sold
</p>

<!-- SVG LAYOUT -->
 <svg viewBox="0 0 600 400" style="width:100%; height:auto; border:1px solid #ccc;">

  <!-- Row 1 -->
  <polygon id="plot-1" class="plot" points="50,50 120,50 120,100 50,100"/>
  <polygon id="plot-2" class="plot" points="130,50 200,50 200,100 130,100"/>
  <polygon id="plot-3" class="plot" points="210,50 280,50 280,100 210,100"/>
  <polygon id="plot-4" class="plot" points="290,50 360,50 360,100 290,100"/>
  <polygon id="plot-5" class="plot" points="370,50 440,50 440,100 370,100"/>

  <!-- Road -->
  <rect x="40" y="110" width="420" height="30" fill="#555"/>

  <!-- Row 2 -->
  <polygon id="plot-6" class="plot" points="50,150 120,150 120,200 50,200"/>
  <polygon id="plot-7" class="plot" points="130,150 200,150 200,200 130,200"/>
  <polygon id="plot-8" class="plot" points="210,150 280,150 280,200 210,200"/>
  <polygon id="plot-9" class="plot" points="290,150 360,150 360,200 290,200"/>
  <polygon id="plot-10" class="plot" points="370,150 440,150 440,200 370,200"/>

  <!-- Park -->
  <rect x="470" y="50" width="100" height="150" fill="#90ee90"/>

  <!-- Labels -->
  <text x="60" y="80" font-size="12">1</text>
  <text x="140" y="80" font-size="12">2</text>
  <text x="220" y="80" font-size="12">3</text>
  <text x="300" y="80" font-size="12">4</text>
  <text x="380" y="80" font-size="12">5</text>

  <text x="60" y="180" font-size="12">6</text>
  <text x="140" y="180" font-size="12">7</text>
  <text x="220" y="180" font-size="12">8</text>
  <text x="300" y="180" font-size="12">9</text>
  <text x="380" y="180" font-size="12">10</text>

</svg>

</svg> -->

<div id="popup"></div>

<script src="assets/js/app.js"></script>

</body>
</html>
