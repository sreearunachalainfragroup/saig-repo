<!doctype html>
<html lang="en">

<head>
  <title>Sree Arunachala Infra Group</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="assets/img/saig-without-textlogo.svg">
  <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Projects main content -->
  <main class="container flex-fill">

    <section class="py-5">

      <div class="container">

        <!-- Solaris Meadows Videos -->
        <div class="project-details-margin">
          <!-- Loads dynamic content from sheets -->
          <h3 id="projectTitle" class="text-center custom-font-large custom-font-bold mt-5 mb-5"></h3>
          <p id="projectSubtitle" class="custom-font-paras custom-font-semibold text-center mb-5"></p>

          <!-- Videos Container -->
          <div id="videosContainer" data-project="">
            <!-- Loading Spinner -->
            <div class="text-center py-5" id="videoLoading">
              <div class="spinner-border" style="color:var(--saig-logo-brown-dark);" role="status">
              </div>
              <p class="mt-3 custom-font-paras">
                Loading videos...
              </p>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <!-- Footer-->
  <div id="footer" class="mt-auto py-1"></div>

  <!-- Video Modal -->
  <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-xl modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">SAIG Videos</h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal">
          </button>

        </div>

        <div class="modal-body p-0">

          <div class="ratio ratio-16x9">

            <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen>
            </iframe>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/common.js"></script>

</body>

</html>
